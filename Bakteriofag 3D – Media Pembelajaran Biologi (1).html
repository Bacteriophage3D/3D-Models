<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bakteriofag 3D – Media Pembelajaran Biologi</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f4f6f8;--card:#fff;--tx:#17212b;--mu:#5b6875;--bd:#d9e0e6;--ac:#1f7a8c}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10161c;--card:#18212a;--tx:#e8eef3;--mu:#9aa8b5;--bd:#2a3642;--ac:#5cc0d3}}
:root[data-theme="dark"]{--bg:#10161c;--card:#18212a;--tx:#e8eef3;--mu:#9aa8b5;--bd:#2a3642;--ac:#5cc0d3}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5}
header,main,.sum{max-width:1100px;margin:0 auto;padding-left:16px;padding-right:16px}
header{padding-top:18px}
h1{font-size:1.35rem;margin:0 0 2px}
header p{margin:0;color:var(--mu);font-size:.9rem}
#bar{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 8px}
button{font:inherit;cursor:pointer}
#bar button{background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:999px;padding:6px 13px;font-size:.8rem}
#bar button[aria-pressed="true"]{background:var(--ac);border-color:var(--ac);color:#04161a}
#stage{position:relative;height:660px;border-radius:16px;overflow:hidden;background:radial-gradient(circle at 50% 42%,#2e3f4e,#0b1116);touch-action:none;cursor:grab}
@media (max-width:700px){#stage{height:560px}}
canvas{display:block;width:100%;height:100%}
#lay{position:absolute;inset:0;pointer-events:none}
#lines{position:absolute;inset:0;width:100%;height:100%}
.lbl{--c:#8fa9bd;position:absolute;left:0;top:0;width:158px;pointer-events:auto;cursor:pointer;color:#f2f6f9;font-size:.76rem;line-height:1.35;padding:7px 10px;border-radius:11px;border:1px solid var(--c);background:color-mix(in srgb,var(--c) 20%,rgba(10,15,20,.86));backdrop-filter:blur(6px);transition:width .2s,box-shadow .2s,background .3s,border-color .3s;z-index:1}
.lbl .t{font-weight:700;font-size:.82rem;display:flex;align-items:center;gap:7px}
.lbl .t i{width:11px;height:11px;border-radius:50%;background:var(--c);box-shadow:0 0 8px var(--c);flex:none}
.lbl .s{color:#c9d5de;margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.lbl .x{display:none;margin-top:5px}
.lbl .x p{margin:5px 0}
.lbl .tip{background:rgba(255,255,255,.1);border-radius:7px;padding:5px 7px}
.lbl.hv{box-shadow:0 0 0 2px var(--c),0 0 16px var(--c)}
.lbl.on{width:250px;z-index:5;box-shadow:0 0 0 2px var(--c),0 6px 24px rgba(0,0,0,.5)}
.lbl.on .x{display:block}.lbl.on .s{display:none}
@media (max-width:700px){.lbl{width:104px;font-size:.7rem;padding:6px 8px}.lbl .s{display:none}.lbl .t{font-size:.75rem}.lbl.on{width:212px}}
#hint{position:absolute;left:50%;transform:translateX(-50%);bottom:8px;color:#9fb0bd;font-size:.72rem;pointer-events:none;white-space:nowrap}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px}
.sum{margin-top:14px;padding-bottom:30px}
.sum table{width:100%;border-collapse:collapse;font-size:.85rem}
.sum th,.sum td{border-bottom:1px solid var(--bd);padding:7px 8px;text-align:left;vertical-align:top}
.wrap{overflow-x:auto}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
</style></head>
<body>
<header><h1>🦠 Bakteriofag 3D</h1><p>Geser untuk memutar 360°, scroll/tombol untuk zoom. Klik label atau bagian model untuk membuka pembahasan.</p>
<div id="bar"><button id="bAuto" aria-pressed="true">⟳ Putar otomatis</button><button id="bTr" aria-pressed="false">◐ Kepala transparan</button><button id="bCol" aria-pressed="false">🎨 Warna: Edukasi</button><button id="bIn">＋ Zoom</button><button id="bOut">－ Zoom</button><button id="bRs">↺ Reset</button></div></header>
<main style="padding-top:0;padding-bottom:0"><div id="stage"><canvas id="c"></canvas><svg id="lines"></svg><div id="lay"></div><div id="hint">Drag = putar · Klik = pembahasan</div></div></main>
<div class="sum"><div class="card"><b>Ringkasan Struktur &amp; Fungsi</b><div class="wrap"><table id="tb"><tr><th>Struktur</th><th>Fungsi singkat</th></tr></table></div></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const INFO={
capsid:{n:"Kepala (Kapsid)",e:"Capsid",c:"#8fa9bd",d:"Kepala berbentuk poligon (ikosahedral) yang tersusun dari banyak subunit protein yang disebut kapsomer. Strukturnya kaku dan kuat.",f:"Membungkus dan melindungi materi genetik dari kerusakan (enzim, suhu, pH) sampai virus menemukan sel inang.",t:"Kapsid tersusun dari protein, bukan sel. Virus tidak punya membran sel, sitoplasma, maupun organel."},
dna:{n:"Materi Genetik (DNA)",e:"Genome",c:"#e3c26b",d:"Pada banyak bakteriofag (misalnya T4), materi genetiknya berupa DNA untai ganda yang terlipat padat di dalam kepala.",f:"Membawa informasi genetik. Setelah masuk ke bakteri, DNA ini mengambil alih mesin sel inang untuk membuat virus baru.",t:"Hanya DNA (atau RNA) yang masuk ke sel bakteri. Kapsid dan ekor tetap di luar."},
collar:{n:"Leher (Collar)",e:"Collar / Neck",c:"#c2a98a",d:"Struktur berbentuk cincin yang menghubungkan kepala dengan ekor.",f:"Menjadi penyambung dan jalur keluarnya DNA dari kepala ke ekor saat infeksi. Juga tempat melekatnya serabut penahan (whiskers) pada beberapa fag.",t:"Bayangkan sebagai 'sambungan' antara tabung penyimpanan dan jarum suntik."},
sheath:{n:"Selubung Ekor (Sheath)",e:"Contractile tail sheath",c:"#7e9fae",d:"Tabung berulir yang tersusun dari protein kontraktil, membungkus tabung dalam ekor.",f:"Berkontraksi (memendek) setelah fag menempel, sehingga mendorong tabung dalam menembus dinding sel bakteri.",t:"Cara kerjanya seperti pegas atau otot sederhana yang mendorong jarum suntik."},
core:{n:"Tabung Dalam (Tail Tube)",e:"Inner core tube",c:"#4c5f6b",d:"Saluran berongga yang berada di dalam selubung ekor.",f:"Saat selubung berkontraksi, tabung ini menembus dinding sel dan menjadi lorong tempat DNA virus disuntikkan ke dalam bakteri.",t:"Bagian ini terlihat di sela-sela cincin selubung ekor pada model."},
base:{n:"Lempeng Dasar (Baseplate)",e:"Baseplate",c:"#a98d78",d:"Struktur berbentuk heksagonal di ujung ekor, berisi banyak protein dan enzim.",f:"Berfungsi sebagai pusat pengendali infeksi: menerima sinyal setelah serabut mengenali bakteri, lalu memicu kontraksi selubung ekor.",t:"Bentuk heksagonal berarti ada 6 serabut dan 6 pasak yang tersusun simetris."},
pins:{n:"Pasak Ekor (Tail Pins/Spikes)",e:"Tail spikes",c:"#d3b99a",d:"Duri-duri pendek di bawah lempeng dasar.",f:"Menancap pada permukaan bakteri untuk menempel kuat dan membantu melubangi dinding sel (sebagian membawa enzim pelarut dinding sel).",t:"Fag menempel dulu (adsorpsi), baru menyuntikkan DNA."},
fibers:{n:"Serabut Ekor (Tail Fibers)",e:"Tail fibers",c:"#cfc8b4",d:"Enam serabut panjang berbentuk tungkai berengsel yang keluar dari lempeng dasar.",f:"Mengenali dan menempel pada reseptor spesifik di permukaan bakteri. Inilah yang membuat fag hanya menyerang bakteri tertentu (spesifik inang).",t:"Seperti kunci dan gembok: serabut hanya cocok dengan reseptor bakteri tertentu."}
};
const cv=document.getElementById("c"),stage=document.getElementById("stage");
const R=new THREE.WebGLRenderer({canvas:cv,antialias:true,alpha:true});R.setPixelRatio(Math.min(devicePixelRatio,2));
const S=new THREE.Scene(),cam=new THREE.PerspectiveCamera(40,1,.1,100);let dist=13;
S.add(new THREE.HemisphereLight(0xcfe3f0,0x2a2118,.8));
const L1=new THREE.DirectionalLight(0xffffff,.9);L1.position.set(5,8,7);S.add(L1);
const L2=new THREE.DirectionalLight(0x7fb4d4,.45);L2.position.set(-6,-2,-5);S.add(L2);
const G=new THREE.Group();S.add(G);const parts={};
function M(c,o){return new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:.55,metalness:.1},o||{}))}
function add(k,mesh){mesh.userData.k=k;(parts[k]=parts[k]||[]).push(mesh);G.add(mesh);return mesh}
const capMat=M(0x8fa9bd,{roughness:.35,metalness:.05,flatShading:true,transparent:true,opacity:1});
const cap=add("capsid",new THREE.Mesh(new THREE.IcosahedronGeometry(1.35,0),capMat));cap.scale.set(1,1.3,1);cap.position.y=3.5;
const pts=[];for(let i=0;i<=500;i++){const t=i/500,a=t*Math.PI*2*11,r=.62*Math.sqrt(1-Math.pow(2*t-1,2)*.7);pts.push(new THREE.Vector3(Math.cos(a)*r,3.5+(t-.5)*2.5,Math.sin(a)*r))}
const dm=M(0xe3c26b,{roughness:.4,emissive:0x3a2c08});
add("dna",new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts),500,.05,6),dm));
const pts2=pts.map((p,i)=>{const t=i/500,a=t*Math.PI*2*11+Math.PI,r=.62*Math.sqrt(1-Math.pow(2*t-1,2)*.7);return new THREE.Vector3(Math.cos(a)*r,p.y,Math.sin(a)*r)});
add("dna",new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts2),500,.05,6),M(0xd9a24a,{roughness:.4,emissive:0x3a2008})));
add("collar",new THREE.Mesh(new THREE.CylinderGeometry(.62,.5,.22,32),M(0xc2a98a,{roughness:.6}))).position.y=1.88;
add("core",new THREE.Mesh(new THREE.CylinderGeometry(.2,.2,3.4,20),M(0x4c5f6b,{roughness:.5}))).position.y=.2;
for(let i=0;i<13;i++){const m=add("sheath",new THREE.Mesh(new THREE.TorusGeometry(.4,.115,12,32),M(0x7e9fae,{roughness:.5})));m.rotation.x=Math.PI/2;m.position.y=1.65-i*.215;m.rotation.z=i*.25}
add("base",new THREE.Mesh(new THREE.CylinderGeometry(.85,.85,.3,6),M(0xa98d78,{roughness:.6,flatShading:true}))).position.y=-1.2;
for(let i=0;i<6;i++){const a=i/6*Math.PI*2,p=add("pins",new THREE.Mesh(new THREE.ConeGeometry(.09,.55,10),M(0xd3b99a)));p.position.set(Math.cos(a)*.45,-1.62,Math.sin(a)*.45);p.rotation.x=Math.PI}
const fm=M(0xcfc8b4,{roughness:.5});
for(let i=0;i<6;i++){const a=i/6*Math.PI*2+Math.PI/6,c=Math.cos(a),s=Math.sin(a);
const P=[[.8,-1.1],[1.9,-.55],[2.0,-2.7]].map(q=>new THREE.Vector3(c*q[0],q[1],s*q[0]));
const cu=new THREE.CatmullRomCurve3([P[0],new THREE.Vector3(c*1.4,-.75,s*1.4),P[1],new THREE.Vector3(c*1.95,-1.6,s*1.95),P[2]],false,"catmullrom",.2);
add("fibers",new THREE.Mesh(new THREE.TubeGeometry(cu,40,.055,8),fm));
const k=new THREE.Mesh(new THREE.SphereGeometry(.09,10,10),fm);k.position.copy(P[1]);add("fibers",k)}
G.position.y=-.8;
const ORDER=["capsid","dna","collar","sheath","core","base","pins","fibers"];
const COL={edu:{capsid:"#ef6b7b",dna:"#f5c542",collar:"#f08a3c",sheath:"#6f7be8",core:"#2fb5a8",base:"#c254c9",pins:"#8bd450",fibers:"#4cb8f0"},real:{}};
ORDER.forEach(k=>COL.real[k]=INFO[k].c);
const tgt={};for(const m in COL){tgt[m]={};for(const k in COL[m])tgt[m][k]=new THREE.Color(COL[m][k])}
parts.dna[1].userData.mul=.82;

const ANCH={capsid:[0,4.15,0],dna:[0,3.2,0],collar:[0,1.88,0],sheath:[0,.6,0],core:[0,-.5,0],base:[.5,-1.2,0],pins:[.3,-1.75,.3],fibers:[1.69,-1.6,.975]};
const SIDE={capsid:0,collar:0,core:0,pins:0,dna:1,sheath:1,base:1,fibers:1};
const lay=document.getElementById("lay"),svg=document.getElementById("lines"),tb=document.getElementById("tb");
const NS="http://www.w3.org/2000/svg",L={},LN={},DT={};
let mode="edu",sel_="capsid",hov=null;
ORDER.forEach(k=>{const i=INFO[k],el=document.createElement("div");el.className="lbl";
el.innerHTML='<div class="t"><i></i>'+i.n+'</div><div class="s">'+i.d.split(". ")[0].replace(/\.$/,"")+'.</div><div class="x"><p>'+i.d+'</p><p><b>Fungsi:</b> '+i.f+'</p><p class="tip">💡 '+i.t+'</p></div>';
el.addEventListener("pointerdown",e=>e.stopPropagation());
el.addEventListener("click",()=>sel(k));
el.addEventListener("pointerenter",()=>hov=k);el.addEventListener("pointerleave",()=>{if(hov===k)hov=null});
lay.appendChild(el);L[k]=el;
const ln=document.createElementNS(NS,"line"),dt=document.createElementNS(NS,"circle");dt.setAttribute("r",5);ln.setAttribute("stroke-width",1.6);dt.setAttribute("stroke","#fff");dt.setAttribute("stroke-width",1.5);
svg.appendChild(ln);svg.appendChild(dt);LN[k]=ln;DT[k]=dt;
const r=tb.insertRow();r.innerHTML='<td><span class="dot" data-k="'+k+'"></span><b>'+i.n+'</b></td><td>'+i.f.split(". ")[0].replace(/\.$/,"")+'.</td>'});
function applyMode(){ORDER.forEach(k=>{const c=COL[mode][k];L[k].style.setProperty("--c",c);LN[k].setAttribute("stroke",c);DT[k].setAttribute("fill",c);document.querySelector('.dot[data-k="'+k+'"]').style.background=c})}
applyMode();
function sel(k){sel_=k;ORDER.forEach(j=>L[j].classList.toggle("on",j===k))}
sel("capsid");
let rx=.12,ry=0,auto=true,drag=false,moved=0,lx=0,ly=0;
function size(){const w=stage.clientWidth,h=stage.clientHeight;R.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix()}
new ResizeObserver(size).observe(stage);size();
const rc=new THREE.Raycaster();
function hit(e){const r=cv.getBoundingClientRect();rc.setFromCamera(new THREE.Vector2((e.clientX-r.left)/r.width*2-1,-((e.clientY-r.top)/r.height)*2+1),cam);const h=rc.intersectObjects(G.children,false)[0];return h?h.object.userData.k:null}
stage.addEventListener("pointerdown",e=>{drag=true;moved=0;lx=e.clientX;ly=e.clientY;stage.setPointerCapture(e.pointerId);stage.style.cursor="grabbing"});
stage.addEventListener("pointermove",e=>{if(drag){const dx=e.clientX-lx,dy=e.clientY-ly;lx=e.clientX;ly=e.clientY;moved+=Math.abs(dx)+Math.abs(dy);ry+=dx*.01;rx=Math.max(-1.2,Math.min(1.2,rx+dy*.008))}else if(e.pointerType==="mouse"){hov=hit(e);stage.style.cursor=hov?"pointer":"grab"}});
stage.addEventListener("pointerup",e=>{drag=false;stage.style.cursor="grab";if(moved<6){const k=hit(e);if(k)sel(k)}});
stage.addEventListener("wheel",e=>{e.preventDefault();zoom(e.deltaY*.01)},{passive:false});
function zoom(d){dist=Math.max(8,Math.min(22,dist+d))}
const B=id=>document.getElementById(id);
B("bAuto").onclick=function(){auto=!auto;this.setAttribute("aria-pressed",auto)};
B("bTr").onclick=function(){const on=this.getAttribute("aria-pressed")!=="true";this.setAttribute("aria-pressed",on);capMat.opacity=on?.28:1};
B("bCol").onclick=function(){mode=mode==="edu"?"real":"edu";this.textContent="🎨 Warna: "+(mode==="edu"?"Edukasi":"Realistis");this.setAttribute("aria-pressed",mode==="real");applyMode()};
B("bIn").onclick=()=>zoom(-2);B("bOut").onclick=()=>zoom(2);
B("bRs").onclick=()=>{rx=.12;ry=0;dist=14};
dist=14;
function layout(){const W=stage.clientWidth,H=stage.clientHeight,side=[[],[]];
for(const k of ORDER){const v=new THREE.Vector3(ANCH[k][0],ANCH[k][1],ANCH[k][2]);G.localToWorld(v);v.project(cam);const el=L[k];side[SIDE[k]].push({k,x:(v.x+1)/2*W,y:(1-v.y)/2*H,h:el.offsetHeight,w:el.offsetWidth})}
side.forEach((arr,s)=>{arr.sort((a,b)=>a.y-b.y);let top=6;arr.forEach(o=>{o.t=Math.max(top,o.y-o.h/2);top=o.t+o.h+6});let bot=H-6;for(let i=arr.length-1;i>=0;i--){const o=arr[i];if(o.t+o.h>bot)o.t=bot-o.h;bot=o.t-6}
arr.forEach(o=>{const lx=s?W-o.w-8:8;L[o.k].style.transform="translate("+lx+"px,"+Math.max(4,o.t)+"px)";
const ex=s?lx:lx+o.w,ey=Math.max(4,o.t)+16,ln=LN[o.k],d=DT[o.k];
ln.setAttribute("x1",o.x);ln.setAttribute("y1",o.y);ln.setAttribute("x2",ex);ln.setAttribute("y2",ey);d.setAttribute("cx",o.x);d.setAttribute("cy",o.y);
const act=o.k===sel_||o.k===hov;ln.setAttribute("opacity",act?1:.55);L[o.k].classList.toggle("hv",o.k===hov&&o.k!==sel_)})})}
let t0=0;
(function loop(t){requestAnimationFrame(loop);const dt=Math.min((t-t0)/1000,.05);t0=t;if(auto&&!drag&&!hov)ry+=dt*.5;
G.rotation.set(rx,ry,0);cam.position.set(0,0,dist);cam.lookAt(0,0,0);cam.updateMatrixWorld();G.updateMatrixWorld(true);
for(const k in parts)parts[k].forEach(m=>{const c=tgt[mode][k].clone().multiplyScalar(m.userData.mul||1),mt=m.material;mt.color.lerp(c,.12);mt.emissive.copy(mt.color);mt.emissiveIntensity=k===sel_?.35+.15*Math.sin(t*.005):k===hov?.3:(k==="dna"?.12:0)});
R.render(S,cam);layout()})(0);
</script></body></html>
